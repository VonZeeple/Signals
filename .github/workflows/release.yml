name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example: 0.3.4 or 0.3.4-rc1)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease (it will not be the latest release)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Get the source code from the master branch
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Install .NET 10
      # ------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ------------------------------------------------------------
      # 3. Download Vintage Story 1.22.0
      # ------------------------------------------------------------
      - name: Download Vintage Story 1.22.0
        run: |
          mkdir -p "$HOME/vintagestory"

          wget -O /tmp/vintagestory.tar.gz \
            "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.0.tar.gz"

          tar -xzf /tmp/vintagestory.tar.gz \
            -C "$HOME/vintagestory"

      # ------------------------------------------------------------
      # 4. Tell the project where Vintage Story is installed
      # ------------------------------------------------------------
      - name: Set Vintage Story path
        run: |
          echo "VINTAGE_STORY=$HOME/vintagestory" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 5. Check that all required Vintage Story DLLs exist
      # ------------------------------------------------------------
      - name: Check Vintage Story dependencies
        run: |
          echo "Checking Vintage Story installation..."
          echo "VINTAGE_STORY=$VINTAGE_STORY"
          echo

          test -f "$VINTAGE_STORY/VintagestoryAPI.dll"
          test -f "$VINTAGE_STORY/Mods/VSEssentials.dll"
          test -f "$VINTAGE_STORY/Mods/VSSurvivalMod.dll"
          test -f "$VINTAGE_STORY/Lib/protobuf-net.dll"
          test -f "$VINTAGE_STORY/Lib/Newtonsoft.Json.dll"

          echo "All required DLLs were found!"

      # ------------------------------------------------------------
      # 6. Display the version we're going to release
      # ------------------------------------------------------------
      - name: Show release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "Release version: $RELEASE_VERSION"
          echo "Release tag: v$RELEASE_VERSION"

      # ------------------------------------------------------------
      # 7. Build Mod
      # ------------------------------------------------------------
      - name: Build Mod
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "ERROR: Version must use x.y.z or x.y.z-prerelease (received: $RELEASE_VERSION)"
            exit 1
          fi

          sed -i -E "s#<Version>[^<]*</Version>#<Version>${RELEASE_VERSION}</Version>#" signals.csproj
          grep -qF "<Version>${RELEASE_VERSION}</Version>" signals.csproj

          dotnet build \
            --configuration Release \
            -p:Version="$RELEASE_VERSION"

      # ------------------------------------------------------------
      # 8. Find the ZIP created by the build
      # ------------------------------------------------------------
      - name: Find release package
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "Looking for release package..."

          PACKAGE=$(find . -type f -name "*_v${RELEASE_VERSION}.zip" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No release ZIP was found!"
            echo
            echo "ZIP files that do exist:"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Found package:"
          echo "$PACKAGE"

          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 9. Create the GitHub Release
      #
      # gh release create will:
      #   - create tag v<version>
      #   - point it at master
      #   - generate release notes
      #   - upload the ZIP
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"

          echo "Creating release $TAG"
          echo "Tag will point to master"
          echo "Uploading $PACKAGE"

          RELEASE_FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target master \
            --generate-notes \
            --title "$TAG" \
            --fail-on-no-commits \
            "${RELEASE_FLAGS[@]}" \
            "$PACKAGE"